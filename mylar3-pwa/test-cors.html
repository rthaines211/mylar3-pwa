<!DOCTYPE html>
<html>
<head>
    <title>CORS Test</title>
</head>
<body>
    <h1>CORS Test</h1>
    <div id="result"></div>
    <script>
        async function testCORS() {
            const resultDiv = document.getElementById('result');
            
            // Determine the correct CORS server URL
            const protocol = window.location.protocol;
            const hostname = window.location.hostname;
            const corsUrl = `${protocol}//${hostname}:8002/mylar.db?v=${Date.now()}`;
            
            resultDiv.innerHTML = `
                <p>Current URL: ${window.location.href}</p>
                <p>Testing CORS server at: ${corsUrl}</p>
                <p>Status: Testing...</p>
            `;
            
            try {
                const response = await fetch(corsUrl, {
                    method: 'GET',
                    cache: 'no-cache',
                    headers: {
                        'Cache-Control': 'no-cache',
                        'Pragma': 'no-cache'
                    }
                });
                
                resultDiv.innerHTML += `
                    <p style="color: green;">✅ Success! Status: ${response.status}</p>
                    <p>Response size: ${response.headers.get('content-length')} bytes</p>
                    <p>CORS Origin: ${response.headers.get('access-control-allow-origin')}</p>
                `;
                
                // Try to read a small portion
                const arrayBuffer = await response.arrayBuffer();
                resultDiv.innerHTML += `<p>✅ Successfully read ${arrayBuffer.byteLength} bytes</p>`;
                
            } catch (error) {
                resultDiv.innerHTML += `<p style="color: red;">❌ Error: ${error.message}</p>`;
                console.error('CORS test error:', error);
            }
        }
        
        // Run test when page loads
        testCORS();
    </script>
</body>
</html>
