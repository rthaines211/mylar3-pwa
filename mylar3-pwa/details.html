  <script>
    const KEY = '274fb029315c3937d613c7272630f08c';
    let database = null;
    let sqlJsReady = false;
    
    // Get the appropriate API URL based on current server
    const getApiUrl = () => {
      // If running on localhost, use the proxy server on port 3000
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        return `${window.location.protocol}//localhost:3000`;
      }
      // For mobile/remote access, use the mobile server on port 8888 which includes proxy functionality
      return `${window.location.protocol}//${window.location.hostname}:8888`;
    };
    
    // Initialize SQL.js with fallback to traditional method
    async function initializeDatabase() {
      if (database && sqlJsReady) {
        return database;
      }
      
      console.log('Initializing database for details page...');
      
      try {
        // Try to use cached database first
        if (window.dbCache) {
          console.log('Using cached database...');
          const cachedDb = await window.dbCache.loadDatabase();
          if (cachedDb) {
            database = cachedDb;
            sqlJsReady = true;
            return database;
          }
        }
      } catch (cacheError) {
        console.warn('Cache loading failed, falling back to traditional method:', cacheError);
      }
      
      // Fallback to traditional database loading
      if (typeof window.initSqlJs === 'undefined') {
        throw new Error('SQL.js library is not available. Please ensure sql-wasm.js is accessible in the lib/ directory.');
      }
      
      const SQL = await window.initSqlJs({
        locateFile: file => `./lib/${file}`
      });
      
      // Try database endpoints (with cache busting) - prioritize CORS server with current data
      const timestamp = Date.now();
      const corsServerUrl = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
        ? 'http://localhost:8002' 
        : `http://${window.location.hostname}:8002`;
      
      const endpoints = [
        `${corsServerUrl}/mylar.db?v=${timestamp}`, // Always try CORS server first (current data)
        (window.location.hostname !== 'localhost') ? `/mylar.db?v=${timestamp}` : null // Only fallback for non-localhost
      ].filter(Boolean);

      let response = null;
      let lastError = null;

      for (const endpoint of endpoints) {
        try {
          response = await fetch(endpoint, {
            cache: 'no-cache',
            headers: {
              'Cache-Control': 'no-cache',
              'Pragma': 'no-cache'
            }
          });
          if (response.ok) {
            console.log(`Successfully fetched database from: ${endpoint}`);
            break;
          }
          lastError = `${endpoint}: ${response.status} ${response.statusText}`;
        } catch (err) {
          lastError = `${endpoint}: ${err.message}`;
        }
      }

      if (!response || !response.ok) {
        throw new Error(`Failed to fetch database from any endpoint. Last error: ${lastError}`);
      }
      
      const arrayBuffer = await response.arrayBuffer();
      database = new SQL.Database(new Uint8Array(arrayBuffer));
      sqlJsReady = true;
      
      return database;
    }
    
    function getParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }
    
    async function fetchComic(id) {
      try {
        // Try API first for backward compatibility
        const res = await fetch(`${getApiUrl()}/api/mylar?cmd=getIndex&apikey=${KEY}`);
        if (res.ok) {
          const json = await res.json();
          return (json.data||[]).find(c=>c.id===id);
        }
      } catch (e) {
        console.log('API not available, falling back to SQL database');
      }
      
      // Fallback to SQL database
      try {
        const db = await initializeDatabase();
        const query = `SELECT * FROM comics WHERE ComicID = ?`;
        const result = db.exec(query, [id]);
        
        if (result.length > 0) {
          const { columns, values } = result[0];
          if (values.length > 0) {
            const row = values[0];
            const comic = columns.reduce((obj, col, i) => (obj[col] = row[i], obj), {});
            
            // Map database fields to expected format
            return {
              id: comic.ComicID,
              name: comic.ComicName,
              publisher: comic.ComicPublisher,
              year: comic.ComicYear,
              status: comic.Status,
              latestIssue: comic.LatestIssue,
              totalIssues: comic.Total,
              imageURL: comic.ComicImageURL || comic.ComicImage,
              detailsURL: comic.DetailURL
            };
          }
        }
      } catch (sqlError) {
        console.error('SQL fallback failed:', sqlError);
      }
      
      return null;
    }
    
    async function fetchComicIssues(comicId) {
      try {
        // Try API first for backward compatibility
        const res = await fetch(`${getApiUrl()}/api/mylar?cmd=getIssues&id=${comicId}&apikey=${KEY}`);
        if (res.ok) {
          const json = await res.json();
          // Check if API call was successful and has issues
          if (json.success !== false && json.issues && json.issues.length > 0) {
            return json.issues;
          }
        }
      } catch (e) {
        console.log('API not available for issues, using SQL database');
      }      // Use SQL database to fetch issues
      try {
        const db = await initializeDatabase();
        
        // First, let's check if the issues table exists and what columns it has
        const tablesResult = db.exec("SELECT name FROM sqlite_master WHERE type='table' AND name='issues';");
        
        if (tablesResult.length > 0) {
          // Check table structure to see what image columns are available
          const structureResult = db.exec("PRAGMA table_info(issues);");
          const columns = structureResult[0]?.values || [];
          const columnNames = columns.map(col => col[1]);
          
          // Determine which image columns exist
          const imageColumns = [];
          if (columnNames.includes('ImageURL')) imageColumns.push('ImageURL');
          if (columnNames.includes('ImageALT')) imageColumns.push('ImageALT');
          if (columnNames.includes('ImageURL_ALT')) imageColumns.push('ImageURL_ALT');
          if (columnNames.includes('CoverImage')) imageColumns.push('CoverImage');
          
          // Build SQL query with available columns
          const baseColumns = ['IssueID', 'Issue_Number', 'IssueName', 'IssueDate', 'Status', 'DateAdded'];
          const selectColumns = [...baseColumns, ...imageColumns];
          const selectClause = selectColumns.join(', ');
          
          // Try to find issues with both string and integer comparison
          const queries = [
            `SELECT ${selectClause} FROM issues WHERE ComicID = ? ORDER BY CAST(Issue_Number AS INTEGER) ASC`,
            `SELECT ${selectClause} FROM issues WHERE ComicID = '${comicId}' ORDER BY CAST(Issue_Number AS INTEGER) ASC`
          ];
          
          // Try integer conversion if comicId is a valid number
          if (!isNaN(parseInt(comicId))) {
            queries.push(`SELECT ${selectClause} FROM issues WHERE ComicID = ${parseInt(comicId)} ORDER BY CAST(Issue_Number AS INTEGER) ASC`);
          }
          
          for (let i = 0; i < queries.length; i++) {
            try {
              const result = i === 0 ? db.exec(queries[i], [comicId]) : db.exec(queries[i]);
              
              if (result.length > 0) {
                const { columns, values } = result[0];
                
                const issues = values.map(row => {
                  const issue = columns.reduce((obj, col, i) => (obj[col] = row[i], obj), {});
                  
                  // Build issue object with available image data
                  const processedIssue = {
                    IssueID: issue.IssueID,
                    Issue_Number: issue.Issue_Number,
                    IssueName: issue.IssueName,
                    ReleaseDate: issue.IssueDate,
                    Status: issue.Status,
                    DateAdded: issue.DateAdded
                  };
                  
                  // Add image data if available
                  if (imageColumns.length > 0) {
                    processedIssue.ImageURL = issue.ImageURL || issue.ImageALT || issue.ImageURL_ALT || issue.CoverImage;
                    processedIssue.CoverImage = issue.CoverImage || issue.ImageURL || issue.ImageALT || issue.ImageURL_ALT;
                  }
                  
                  return processedIssue;
                });
                
                if (issues.length > 0) {
                  return issues;
                }
              }
            } catch (queryError) {
              console.error(`Issues query ${i + 1} failed:`, queryError);
            }
          }        }
      } catch (sqlError) {
        console.error('SQL issues fetch failed:', sqlError);
      }

      // Return empty array if no issues found
      return [];
    }
    
    function getStatusColor(status) {
      switch (status.toLowerCase()) {
        case 'active': return 'bg-[#CCAF45] text-[#1F1F1F]';
        case 'paused': return 'bg-orange-600 text-orange-200';
        case 'ended': return 'bg-gray-600 text-gray-200';
        case 'loading': return 'bg-blue-700 text-blue-200';
        default: return 'bg-[#444444] text-[#ECECEC]';
      }
    }
    
    function getIssueStatusColor(status) {
      switch (status.toLowerCase()) {
        case 'downloaded': return 'bg-green-700 text-green-200';
        case 'wanted': return 'bg-red-700 text-red-200';
        case 'snatched': return 'bg-blue-700 text-blue-200';
        case 'archived': return 'bg-purple-700 text-purple-200';
        case 'ignored': return 'bg-gray-600 text-gray-200';
        case 'skipped': return 'bg-yellow-600 text-yellow-200';
        default: return 'bg-[#444444] text-[#ECECEC]';
      }
    }
    
    function renderDetails(c, issues = []) {
      const el = document.getElementById('details');
      if(!c) return el.textContent='Comic not found.';
      
      console.log('Rendering details with issues:', issues.length); // Debug log
      
      // Match the add.html comic details styling
      el.innerHTML = `
        <!-- Comic Details Card -->
        <div class="comic-details-card bg-[#2D2D2D] rounded-lg p-4 border border-[#444444] mb-6">
          <div class="flex items-start space-x-4 mb-4">
            ${c.imageURL ? 
              `<img data-src="${c.imageURL}" alt="${c.name}" class="w-24 h-32 object-cover rounded-lg border border-[#444444] critical-image flex-shrink-0" />` : 
              '<div class="w-24 h-32 bg-[#444444] rounded-lg flex items-center justify-center flex-shrink-0"><svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-[#666666]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg></div>'
            }
            <div class="flex-1 min-w-0 text-center">
              <!-- Title and Publisher -->
              <h2 class="comic-title text-xl sm:text-2xl font-bold text-[#ECECEC] mb-1">${c.name}</h2>
              <p class="comic-publisher text-base text-[#CCCCCC] mb-3">${c.publisher || 'Unknown Publisher'}</p>
              
              <!-- Comic Details - Single Line -->
              <div class="flex items-center justify-center space-x-4 mb-4">
                <span class="comic-year text-[#CCAF45] font-medium text-sm">${c.year || 'Unknown'}</span>
                <span class="comic-issues text-[#ECECEC] text-sm">${issues.length || c.totalIssues || 'Unknown'} issues</span>
                <span class="text-xs font-bold px-2 py-1 rounded ${getStatusColor(c.status || 'Active')}">${c.status || 'Active'}</span>
              </div>
            </div>
          </div>
          
          <!-- Action Buttons - Full Width Centered -->
          <div class="flex flex-wrap justify-center gap-2 pt-2 border-t border-[#444444]">
            <button 
              id="pauseBtn" 
              onclick="pauseComic('${c.id}')"
              class="details-button flex-1 max-w-[120px] disabled:opacity-50 disabled:cursor-not-allowed"
              ${c.status === 'Paused' ? 'style="display: none;"' : ''}
            >
              Pause Series
            </button>
            <button 
              id="resumeBtn" 
              onclick="resumeComic('${c.id}')"
              class="details-button flex-1 max-w-[120px] disabled:opacity-50 disabled:cursor-not-allowed"
              ${c.status !== 'Paused' ? 'style="display: none;"' : ''}
            >
              Resume Series
            </button>
            <button 
              id="deleteBtn" 
              onclick="confirmDeleteComic('${c.id}', '${c.name.replace(/'/g, "\\'")}')"
              class="details-button danger flex-1 max-w-[120px] disabled:opacity-50 disabled:cursor-not-allowed"
            >
              Delete Series
            </button>
            ${c.detailsURL ? `
            <a href="${c.detailsURL}" target="_blank" class="details-button accent flex-1 max-w-[120px]">
              View Details
            </a>
            ` : ''}
          </div>
        </div>
      `;
      
      // Add issues section separately - always show for debugging
      console.log('About to render issues section, issues length:', issues.length);
      
      // Always show issues section for debugging purposes
      el.innerHTML += `
        <div class="mb-4 mt-6">
          <h3 class="text-lg font-semibold text-[#ECECEC] mb-3">Issues (${issues.length})</h3>
        </div>
        
        <div class="mb-4 flex justify-between items-center">
          <div class="flex items-center space-x-4">
            <button 
              id="toggleIssues" 
              onclick="toggleIssuesList()"
              class="details-button text-sm py-1"
            >
              Show All
            </button>
          </div>
          
          <span id="paginationInfo" class="text-xs text-[#999999]">
            Showing ${Math.min(5, issues.length)} of ${issues.length} issues
          </span>
        </div>
        
        <div id="issuesList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">
          ${issues.length > 0 ? renderIssuesList(issues.slice(0, 5)) : '<div class="text-[#999999] text-center col-span-full">No issues found for this comic.</div>'}
        </div>
      `;
      
      // Initialize lazy loading for the rendered content
      setTimeout(() => {
        if (window.lazyLoader) {
          window.lazyLoader.refresh();
        }
      }, 100);
    }
    
    function renderIssuesList(issues) {
      return issues.map(issue => `
        <div class="bg-[#2D2D2D] rounded-lg p-3 border border-[#444444] hover:border-[#CCAF45] transition-colors duration-200">
          <div class="flex items-start space-x-3">
            ${issue.ImageURL || issue.CoverImage ? 
              `<img data-src="${issue.ImageURL || issue.CoverImage}" alt="Issue #${issue.Issue_Number}" class="w-12 h-16 object-cover rounded border border-[#444444]" />
               <div class="w-12 h-16 bg-[#444444] rounded flex items-center justify-center image-skeleton" style="display: none;">
                 <span class="text-xs text-[#666666] font-medium">#${issue.Issue_Number || '?'}</span>
               </div>` : 
              `<div class="w-12 h-16 bg-[#444444] rounded flex items-center justify-center">
                 <span class="text-xs text-[#666666] font-medium">#${issue.Issue_Number || '?'}</span>
               </div>`
            }
            <div class="flex-1 min-w-0">
              <div class="flex items-start justify-between">
                <div class="flex-1 min-w-0">
                  <h4 class="font-semibold text-[#ECECEC] text-sm mb-1">Issue #${issue.Issue_Number || 'Unknown'}</h4>
                  ${issue.IssueName ? `<p class="text-xs text-[#CCCCCC] mb-1 truncate issue-name">${issue.IssueName}</p>` : ''}
                  ${issue.ReleaseDate ? `<p class="text-xs text-[#999999] mb-1 issue-date">${issue.ReleaseDate}</p>` : ''}
                </div>
                <span class="text-xs font-bold px-2 py-1 rounded ${getIssueStatusColor(issue.Status || 'Unknown')} ml-2 flex-shrink-0">${issue.Status || 'Unknown'}</span>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }
    
    let showingAllIssues = false;
    let allIssues = [];
    
    function toggleIssuesList() {
      const issuesList = document.getElementById('issuesList');
      const toggleButton = document.getElementById('toggleIssues');
      const paginationInfo = document.getElementById('paginationInfo');
      
      if (!showingAllIssues) {
        // Show all issues
        issuesList.innerHTML = renderIssuesList(allIssues);
        toggleButton.textContent = 'Show Recent';
        if (paginationInfo) {
          paginationInfo.textContent = `Showing ${allIssues.length} of ${allIssues.length} issues`;
        }
        showingAllIssues = true;
      } else {
        // Show only recent 5 issues
        issuesList.innerHTML = renderIssuesList(allIssues.slice(0, 5));
        toggleButton.textContent = 'Show All';
        if (paginationInfo) {
          paginationInfo.textContent = `Showing ${Math.min(5, allIssues.length)} of ${allIssues.length} issues`;
        }
        showingAllIssues = false;
      }
      
      // Refresh lazy loading after content change
      setTimeout(() => {
        if (window.lazyLoader) {
          window.lazyLoader.refresh();
        }
      }, 100);
    }
    
    // Function to pause a comic
    async function pauseComic(comicId) {
      const pauseBtn = document.getElementById('pauseBtn');
      const resumeBtn = document.getElementById('resumeBtn');
      
      // Disable button during request
      pauseBtn.disabled = true;
      pauseBtn.textContent = 'Pausing...';
      
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000); // 30 second timeout
        
        const response = await fetch(`${getApiUrl()}/api/mylar?cmd=pauseComic&apikey=${KEY}&id=${comicId}`, {
          signal: controller.signal
        });
        
        clearTimeout(timeoutId);
        
        if (response.ok || response.status === 500) {
          // Sometimes Mylar3 returns 500 even when the operation succeeds
          let result = null;
          try {
            result = await response.json();
            console.log('Pause response:', result);
            
            // Check if the API call was actually successful
            if (result && result.success === false) {
              throw new Error(result.error || 'API returned success: false');
            }
          } catch (jsonError) {
            // If we can't parse JSON but got a response, assume success
            console.log('Could not parse JSON response, assuming success');
          }
          
          // Show success message
          showMessage('Comic paused successfully', 'success');
          
          // Refresh the page after a longer delay to ensure the database is updated
          setTimeout(() => {
            window.location.reload();
          }, 3000);
        } else {
          throw new Error(`Server responded with status: ${response.status}`);
        }
      } catch (error) {
        if (error.name === 'AbortError') {
          showMessage('Request timed out - but the comic may still be paused. Please refresh the page.', 'info');
        } else {
          console.error('Error pausing comic:', error);
          showMessage('Failed to pause comic', 'error');
        }
        
        // Reset button state
        pauseBtn.disabled = false;
        pauseBtn.textContent = 'Pause Series';
      }
    }
    
    // Function to resume a comic
    async function resumeComic(comicId) {
      const pauseBtn = document.getElementById('pauseBtn');
      const resumeBtn = document.getElementById('resumeBtn');
      
      // Disable button during request
      resumeBtn.disabled = true;
      resumeBtn.textContent = 'Resuming...';
      
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000); // 30 second timeout
        
        const response = await fetch(`${getApiUrl()}/api/mylar?cmd=resumeComic&apikey=${KEY}&id=${comicId}`, {
          signal: controller.signal
        });
        
        clearTimeout(timeoutId);
        
        if (response.ok || response.status === 500) {
          // Sometimes Mylar3 returns 500 even when the operation succeeds
          let result = null;
          try {
            result = await response.json();
            console.log('Resume response:', result);
            
            // Check if the API call was actually successful
            if (result && result.success === false) {
              throw new Error(result.error || 'API returned success: false');
            }
          } catch (jsonError) {
            // If we can't parse JSON but got a response, assume success
            console.log('Could not parse JSON response, assuming success');
          }
          
          // Show success message
          showMessage('Comic resumed successfully', 'success');
          
          // Refresh the page after a longer delay to ensure the database is updated
          setTimeout(() => {
            window.location.reload();
          }, 3000);
        } else {
          throw new Error(`Server responded with status: ${response.status}`);
        }
      } catch (error) {
        if (error.name === 'AbortError') {
          showMessage('Request timed out - but the comic may still be resumed. Please refresh the page.', 'info');
        } else {
          console.error('Error resuming comic:', error);
          showMessage('Failed to resume comic', 'error');
        }
        
        // Reset button state
        resumeBtn.disabled = false;
        resumeBtn.textContent = 'Resume Series';
      }
    }
    
    // Function to show confirmation dialog for deleting a comic
    function confirmDeleteComic(comicId, comicName) {
      // Create confirmation dialog
      const confirmDialog = document.createElement('div');
      confirmDialog.id = 'deleteConfirmDialog';
      confirmDialog.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4';
      confirmDialog.innerHTML = `
        <div class="bg-[#2D2D2D] border border-[#444444] rounded-lg p-6 max-w-md w-full">
          <div class="text-center">
            <div class="mb-4">
              <svg class="h-12 w-12 text-red-500 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z" />
              </svg>
            </div>
            <h3 class="text-xl font-semibold text-[#ECECEC] mb-2">Delete Comic</h3>
            <p class="text-[#CCCCCC] mb-6">
              Are you sure you want to delete "<strong>${comicName}</strong>"?
              <br><br>
              <span class="text-red-400 text-sm">This action cannot be undone.</span>
            </p>
            <div class="flex flex-col sm:flex-row gap-3 justify-center">
              <button 
                onclick="closeDeleteDialog()"
                class="details-button px-6 py-3 font-semibold focus:outline-none focus:ring-2 focus:ring-[#666666]"
              >
                Cancel
              </button>
              <button 
                onclick="deleteComic('${comicId}')"
                class="details-button danger px-6 py-3 font-semibold focus:outline-none focus:ring-2"
              >
                Delete Comic
              </button>
            </div>
          </div>
        </div>
      `;
      
      // Add to page
      document.body.appendChild(confirmDialog);
      
      // Add click outside to close
      confirmDialog.addEventListener('click', (e) => {
        if (e.target === confirmDialog) {
          closeDeleteDialog();
        }
      });
    }
    
    // Function to close the delete confirmation dialog
    function closeDeleteDialog() {
      const dialog = document.getElementById('deleteConfirmDialog');
      if (dialog) {
        dialog.remove();
      }
    }
    
    // Function to delete a comic
    async function deleteComic(comicId) {
      const dialog = document.getElementById('deleteConfirmDialog');
      const deleteBtn = dialog.querySelector('button[onclick*="deleteComic"]');
      
      // Disable button during request
      deleteBtn.disabled = true;
      deleteBtn.textContent = 'Deleting...';
      
      try {
        const response = await fetch(`${getApiUrl()}/api/mylar?cmd=delComic&apikey=${KEY}&id=${comicId}`);
        
        if (response.ok) {
          // Close dialog
          closeDeleteDialog();
          
          // Redirect to home immediately with success message
          window.location.href = 'index.html?deleted=true';
        } else {
          throw new Error('Failed to delete comic');
        }
      } catch (error) {
        console.error('Error deleting comic:', error);
        showMessage('Failed to delete comic', 'error');
        
        // Reset button state
        deleteBtn.disabled = false;
        deleteBtn.textContent = 'Delete Comic';
      }
    }

    // Function to show temporary messages
    function showMessage(message, type = 'info') {
      // Remove existing message if any
      const existingMessage = document.getElementById('tempMessage');
      if (existingMessage) {
        existingMessage.remove();
      }
      
      // Create message element
      const messageDiv = document.createElement('div');
      messageDiv.id = 'tempMessage';
      messageDiv.className = `fixed top-20 left-4 right-4 z-50 p-4 rounded-lg font-medium text-center ${
        type === 'success' ? 'bg-green-600 text-white' : 
        type === 'error' ? 'bg-red-600 text-white' : 
        'bg-blue-600 text-white'
      }`;
      messageDiv.textContent = message;
      
      // Add to page
      document.body.appendChild(messageDiv);
      
      // Remove after 3 seconds
      setTimeout(() => {
        if (messageDiv) {
          messageDiv.remove();
        }
      }, 3000);
    }

    (async()=>{
      const id = getParam('id');
      console.log('Comic ID from URL:', id, 'Type:', typeof id);
      if(!id) return document.getElementById('details').textContent='No comic ID provided.';
      try {
        const comic = await fetchComic(id);
        console.log('Fetched comic:', comic);
        if (!comic) {
          document.getElementById('details').textContent = 'Comic not found.';
          return;
        }
        
        // Fetch issues for this comic
        try {
          const issues = await fetchComicIssues(id);
          console.log('Final fetched issues:', issues); // Debug log
          // Sort issues by issue number (numeric sort) - newest first
          issues.sort((a, b) => {
            const aNum = parseInt(a.Issue_Number) || 0;
            const bNum = parseInt(b.Issue_Number) || 0;
            return bNum - aNum; // Changed to descending order (newest first)
          });
          allIssues = issues;
          renderDetails(comic, issues);
        } catch (issueError) {
          console.warn('Could not fetch issues:', issueError);
          renderDetails(comic, []);
        }
      } catch(e) {
        document.getElementById('details').textContent='Error loading comic: ' + e.message;
      }
    })();
  </script>
