  <div id="debug-info" style="background:#222;color:#CCAF45;padding:8px;margin-bottom:8px;border-radius:6px;font-size:0.95em;"></div>
  <!-- Top Bar -->
  <header class="fixed top-0 left-0 right-0 bg-[#1F1F1F] flex items-center justify-between px-4 py-3 border-b border-[#444444] z-50" style="padding-top: calc(0.75rem + env(safe-area-inset-top, 0px));">

      id="prevWeekBtn"
      onclick="if (!this.disabled) navigateWeek(-1)"
      class="w-10 h-10 flex items-center justify-center text-[#CCAF45] hover:bg-[#2D2D2D] rounded-full transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-[#CCAF45] focus:ring-opacity-50"
      title="Previous Week"

      </svg>
    </button>
    <div class="text-center">
      <h1 class="text-xl font-semibold">This Week's Pull List</h1>
      <p id="weekInfo" class="text-xs text-[#CCAF45] mt-1">Loading week info...</p>
    </div>
    <button 
      id="nextWeekBtn"
      onclick="if (!this.disabled) navigateWeek(1)"
      class="w-10 h-10 flex items-center justify-center text-[#CCAF45] hover:bg-[#2D2D2D] rounded-full transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-[#CCAF45] focus:ring-opacity-50"
      title="Next Week"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
      </svg>
    </button>
  </header>

  <!-- Main Content -->
  <main class="flex-1 overflow-auto px-4 py-3" style="padding-top: calc(5rem + env(safe-area-inset-top, 0px)); padding-bottom: calc(3rem + env(safe-area-inset-bottom, 0px) * 0.5);">
    <div id="status" class="mb-4 p-3 bg-[#2D2D2D] border border-[#444444] text-[#ECECEC] rounded">Loading…</div>
    
    <!-- Using Direct SQL Database Access -->
    <div class="mb-4 flex items-center justify-between">
      <div class="flex items-center text-[#ECECEC]">
        <div class="w-2 h-2 bg-green-500 rounded-full mr-2"></div>
        <span class="text-sm">Direct Database Access</span>
      </div>
      <button 
        id="toggleAllButton" 
        onclick="toggleAllPublisherSections()"
        class="px-3 py-1 text-xs bg-[#2D2D2D] border border-[#444444] text-[#CCAF45] rounded hover:bg-[#333333] transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-[#CCAF45] focus:ring-opacity-50"
        style="display: none;"
      >
        Expand All
      </button>
    </div>
    
    <div id="pull-list" class="space-y-2"></div>
  </main>

  </nav>

        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>

  <script>
    // Global variables
    let mylarConfig;
    let currentWeekOffset = 0; // 0 = current week, -1 = previous week, +1 = next week
    let database = null;
    let sqlJsReady = false;

    function initializeConfig() {
      mylarConfig = new MylarConfig();
      console.log('Config initialized for pull list page');
    }

    // Force service worker update to handle database requests properly
    async function updateServiceWorker() {
      if ('serviceWorker' in navigator) {
        try {
          const registration = await navigator.serviceWorker.getRegistration();
          if (registration) {
            console.log('Updating service worker...');
            await registration.update();
            console.log('Service worker updated');
          }
        } catch (error) {
          console.warn('Failed to update service worker:', error);
        }
      }
    }

    function showDebugInfo() {
      const debugDiv = document.getElementById('debug-info');
      debugDiv.innerHTML = `
        <b>Debug Info</b><br>
        CORS Server URL: <span id='cors-url'></span><br>
        Current Hostname: ${window.location.hostname}<br>
        <b>How to Fix:</b> If you still see errors, <b>clear browser cache</b> and <b>unregister service worker</b> for this site.<br>
        <b>To Unregister:</b> Open DevTools > Application > Service Workers > Unregister, then reload the page.
      `;
      document.getElementById('cors-url').textContent = mylarConfig.getCorsServerUrl();
    }

    document.addEventListener('DOMContentLoaded', () => {
      initializeConfig();
      updateServiceWorker(); // Force service worker update
      showDebugInfo();
      const statusEl = document.getElementById('status');
      const listEl   = document.getElementById('pull-list');
      const weekInfoEl = document.getElementById('weekInfo');

      // Check if SQL.js is available
      function checkSqlJs() {
        return new Promise((resolve, reject) => {
          console.log('Checking local SQL.js availability...');
          console.log('initSqlJs type:', typeof initSqlJs);
          
          if (typeof initSqlJs !== 'undefined') {
            console.log('Local SQL.js is available');
            sqlJsReady = true;
            resolve();
          } else {
            console.log('Local SQL.js not available, waiting...');
            setTimeout(() => {
              if (typeof initSqlJs !== 'undefined') {
                console.log('Local SQL.js is now available');
                sqlJsReady = true;
                resolve();
              } else {
                console.error('Local SQL.js still not available');
                reject(new Error('Local SQL.js failed to load. Please ensure sql-wasm.js is accessible.'));
              }
            }, 1000);
          }
        });
      }

      // Load pull list data directly from SQL database
      function loadPullList() {
        loadPullListFromSQL();
      }

      // Load directly from SQL database
      async function loadPullListFromSQL() {
        try {
          // Ensure config is initialized
          if (!mylarConfig) {
            statusEl.textContent = 'Initializing configuration...';
            throw new Error('Configuration not initialized');
          }
          
          statusEl.textContent = 'Loading from SQL database...';
          statusEl.className = 'mb-4 p-3 bg-[#2D2D2D] border border-[#444444] text-[#ECECEC] rounded';

          // Ensure SQL.js is ready
          if (!sqlJsReady) {
            statusEl.textContent = 'Waiting for SQL.js to load...';
            await checkSqlJs();
          }

          if (!database) {
            statusEl.textContent = 'Initializing SQL.js...';
            
            // Check if initSqlJs is actually available
            if (typeof initSqlJs === 'undefined') {
              throw new Error('SQL.js library is not available. Please ensure sql-wasm.js is accessible in the lib/ directory.');
            }
            
            // Initialize sql.js with local files
            const SQL = await initSqlJs({
              locateFile: file => `./lib/${file}`
            });
            
            statusEl.textContent = 'Fetching database...';
            
            // Use config for database endpoint
            const endpoint = mylarConfig.getDatabaseUrl();
            const endpoints = [endpoint];
            // Show endpoint in status area for debugging
            statusEl.innerHTML = `<b>Fetching database from:</b> <span style='color:#CCAF45'>${endpoint}</span>`;
            console.log('Database fetch configuration:');
            console.log('  Database endpoint:', endpoint);

            let response = null;
            let lastError = null;

            for (const endpoint of endpoints) {
              try {
                console.log(`Attempting to fetch database from: ${endpoint}`);
                
                // Add no-cache headers to prevent browser caching
                response = await fetch(endpoint, {
                  cache: 'no-cache',
                  headers: {
                    'Cache-Control': 'no-cache',
                    'Pragma': 'no-cache'
                  }
                });
                
                console.log(`Response status: ${response.status} ${response.statusText}`);
                console.log(`Response headers:`, response.headers);
                
                if (response.ok) {
                  console.log(`Successfully fetched database from: ${endpoint}`);
                  break;
                }
                lastError = `${endpoint}: ${response.status} ${response.statusText}`;
                console.warn(`Failed to fetch from ${endpoint}:`, lastError);
              } catch (err) {
                lastError = `${endpoint}: ${err.message}`;
                console.error(`Error fetching from ${endpoint}:`, err);
              }
            }

            if (!response || !response.ok) {
              throw new Error(`Failed to fetch database from any endpoint. Last error: ${lastError}`);
            }
            
            const arrayBuffer = await response.arrayBuffer();
            statusEl.textContent = 'Loading database...';
            
            // Load database
            database = new SQL.Database(new Uint8Array(arrayBuffer));
          }

          statusEl.textContent = 'Querying weekly data...';

          // Query the weekly table for current week's issues (with offset)
          const currentDate = new Date();
          
          // Fix the week calculation - getDay() returns 0=Sunday, 1=Monday, etc.
          const dayOfWeek = currentDate.getDay();
          const daysToMonday = dayOfWeek === 0 ? 6 : dayOfWeek - 1; // If Sunday, go back 6 days; otherwise go back (dayOfWeek - 1) days
          
          const weekStart = new Date(currentDate);
          weekStart.setDate(currentDate.getDate() - daysToMonday + (currentWeekOffset * 7)); // Monday + offset
          const weekEnd = new Date(weekStart);
          weekEnd.setDate(weekStart.getDate() + 6); // Sunday

          const formatDate = (date) => date.toISOString().split('T')[0];
          
          // Calculate week context for display
          let weekContext = '';
          if (currentWeekOffset === 0) {
            weekContext = '(This Week)';
          } else if (currentWeekOffset === -1) {
            weekContext = '(Last Week)';
          } else if (currentWeekOffset === 1) {
            weekContext = '(Next Week)';
          }
          
          console.log(`Current date: ${formatDate(currentDate)}`);
          console.log(`Week offset: ${currentWeekOffset}`);
          console.log(`Week start: ${formatDate(weekStart)}`);
          console.log(`Week end: ${formatDate(weekEnd)}`);
          console.log(`Expected to find data for dates in range: ${formatDate(weekStart)} to ${formatDate(weekEnd)}`);
          
          console.log(`Current date: ${formatDate(currentDate)}`);
          console.log(`Week offset: ${currentWeekOffset}`);
          console.log(`Week start: ${formatDate(weekStart)}`);
          console.log(`Week end: ${formatDate(weekEnd)}`);
          console.log(`Expected to find data for dates in range: ${formatDate(weekStart)} to ${formatDate(weekEnd)}`);

          // First try current week (with offset)
          let query = `
            SELECT SHIPDATE, PUBLISHER, ISSUE, COMIC, STATUS 
            FROM weekly 
            WHERE SHIPDATE BETWEEN '${formatDate(weekStart)}' AND '${formatDate(weekEnd)}'
            ORDER BY PUBLISHER ASC, COMIC ASC
          `;
          
          const weekDescription = currentWeekOffset === 0 ? 'current week' : 
                                 currentWeekOffset === -1 ? 'last week' :
                                 currentWeekOffset === 1 ? 'next week' :
                                 currentWeekOffset < -1 ? `${Math.abs(currentWeekOffset)} weeks ago` :
                                 `${currentWeekOffset} weeks from now`;
          
          console.log(`SQL Query (${weekDescription}): ${query}`);

          let results = database.exec(query);
          
          console.log(`Query results (${weekDescription}):`, results);
          console.log(`Number of result sets:`, results.length);
          if (results.length > 0) {
            console.log(`Columns:`, results[0].columns);
            console.log(`Number of rows:`, results[0].values.length);
            console.log(`First few rows:`, results[0].values.slice(0, 3));
          } else {
            console.log('No results returned from query');
          }
          
          // If no results for the requested week, show a message
          if (results.length === 0) {
            console.log(`No data for ${weekDescription}, checking for any available data...`);
            
            // Calculate the Wednesday date for display even when no data
            const wednesday = new Date(weekStart);
            wednesday.setDate(weekStart.getDate() + 2); // Monday + 2 = Wednesday
            
            const options = { 
              weekday: 'long', 
              year: 'numeric', 
              month: 'long', 
              day: 'numeric' 
            };
            const formattedWednesday = wednesday.toLocaleDateString('en-US', options);
            
            // Check if there's any data in the weekly table
            const anyDataQuery = `SELECT COUNT(*) as count FROM weekly WHERE SHIPDATE IS NOT NULL AND SHIPDATE != ''`;
            const anyDataResult = database.exec(anyDataQuery);
            
            if (anyDataResult.length > 0 && anyDataResult[0].values[0][0] > 0) {
              console.log(`Found ${anyDataResult[0].values[0][0]} total records in weekly table`);
              
              // Show available date ranges
              const dateRangeQuery = `SELECT MIN(SHIPDATE) as min_date, MAX(SHIPDATE) as max_date FROM weekly WHERE SHIPDATE IS NOT NULL AND SHIPDATE != ''`;
              const dateRangeResult = database.exec(dateRangeQuery);
              
              if (dateRangeResult.length > 0) {
                const minDate = dateRangeResult[0].values[0][0];
                const maxDate = dateRangeResult[0].values[0][1];
                console.log(`Available date range: ${minDate} to ${maxDate}`);
                
                statusEl.textContent = `No issues found for ${weekDescription}. Available data: ${minDate} to ${maxDate}`;
                statusEl.className = 'mb-4 p-3 bg-yellow-900 border border-yellow-700 text-yellow-200 rounded';
                
                weekInfoEl.textContent = `${formattedWednesday} ${weekContext} - No data available`;
                listEl.innerHTML = `<div class="bg-[#2D2D2D] border border-[#444444] p-4 rounded text-center text-[#999999]">No issues found for ${weekDescription}<br><small class="text-xs text-[#777777]">Available data: ${minDate} to ${maxDate}</small></div>`;
                return;
              }
            }
            
            // Fallback to most recent week logic only if no data for any week
            const recentWeekQuery = `
              SELECT DISTINCT SHIPDATE 
              FROM weekly 
              WHERE SHIPDATE IS NOT NULL AND SHIPDATE != ''
              ORDER BY SHIPDATE DESC 
              LIMIT 1
            `;
            
            const recentWeekResult = database.exec(recentWeekQuery);
            
            if (recentWeekResult.length > 0) {
              const recentDate = recentWeekResult[0].values[0][0];
              console.log(`No data for current week, using most recent date: ${recentDate}`);
              
              query = `
                SELECT SHIPDATE, PUBLISHER, ISSUE, COMIC, STATUS 
                FROM weekly 
                WHERE SHIPDATE = '${recentDate}'
                ORDER BY PUBLISHER ASC, COMIC ASC
              `;
              
              console.log(`SQL Query (recent week): ${query}`);
              results = database.exec(query);
              console.log(`Query results (recent week):`, results);
              
              // Update week info to show the actual date
              weekInfoEl.textContent = `Most recent data: ${recentDate}`;
            } else {
              statusEl.textContent = 'No issues found in database';
              statusEl.className = 'mb-4 p-3 bg-yellow-900 border border-yellow-700 text-yellow-200 rounded';
              weekInfoEl.textContent = 'No data available';
              listEl.innerHTML = '<div class="bg-[#2D2D2D] border border-[#444444] p-4 rounded text-center text-[#999999]">No issues found in database</div>';
              return;
            }
          } else {
            // Calculate the Wednesday of the current week (to match proxy format)
            const wednesday = new Date(weekStart);
            wednesday.setDate(weekStart.getDate() + 2); // Monday + 2 = Wednesday
            
            const options = { 
              weekday: 'long', 
              year: 'numeric', 
              month: 'long', 
              day: 'numeric' 
            };
            const formattedWednesday = wednesday.toLocaleDateString('en-US', options);
            
            // Add week context to the date
            let weekContext = '';
            if (currentWeekOffset === 0) {
              weekContext = '(This Week)';
            } else if (currentWeekOffset === -1) {
              weekContext = '(Last Week)';
            } else if (currentWeekOffset === 1) {
              weekContext = '(Next Week)';
            } else if (currentWeekOffset < -1) {
              weekContext = `(${Math.abs(currentWeekOffset)} weeks ago)`;
            } else {
              weekContext = `(${currentWeekOffset} weeks from now)`;
            }
            
            weekInfoEl.textContent = `${formattedWednesday} ${weekContext}`;
          }
          
          if (results.length > 0) {
            const { columns, values } = results[0];
            
            console.log(`Columns: ${columns}`);
            console.log(`Values: ${JSON.stringify(values, null, 2)}`);
            
            // Convert to the expected format
            const issues = values.map(row => {
              const issue = columns.reduce((obj, col, i) => (obj[col] = row[i], obj), {});
              return {
                ComicName: issue.COMIC || 'Unknown Series',
                Issue: issue.ISSUE || 'Unknown',
                Publisher: issue.PUBLISHER || '',
                ReleaseDate: issue.SHIPDATE || '',
                Status: issue.STATUS || 'Unknown'
              };
            });

            console.log(`Converted issues:`, issues);

            // Update week info to match proxy format (show Wednesday date)
            const wednesday = new Date(weekStart);
            wednesday.setDate(weekStart.getDate() + 2); // Monday + 2 = Wednesday
            
            const options = { 
              weekday: 'long', 
              year: 'numeric', 
              month: 'long', 
              day: 'numeric' 
            };
            const formattedWednesday = wednesday.toLocaleDateString('en-US', options);
            
            weekInfoEl.textContent = `${formattedWednesday} ${weekContext}`;

            statusEl.textContent = `Found ${issues.length} issues in pull list`;
            statusEl.className = 'mb-4 p-3 bg-green-900 border border-green-700 text-green-200 rounded';
            
            renderPullList(issues);
          } else {
            console.log('No results from query');
            statusEl.textContent = 'No issues found in database for this week';
            statusEl.className = 'mb-4 p-3 bg-yellow-900 border border-yellow-700 text-yellow-200 rounded';
            listEl.innerHTML = '<div class="bg-[#2D2D2D] border border-[#444444] p-4 rounded text-center text-[#999999]">No issues found for this week</div>';
          }

        } catch (err) {
          console.error('SQL error:', err);
          let errorMessage = err.message;
          
          // Provide more helpful error messages
          if (err.message.includes('Local SQL.js library is not available')) {
            errorMessage = 'Local SQL.js could not be loaded. Please ensure sql-wasm.js is in the lib/ directory.';
          } else if (err.message.includes('Failed to fetch database')) {
            errorMessage = 'Could not access the Mylar database. Make sure Mylar3 is running and accessible.';
          }
          
          statusEl.textContent = `Error loading from database: ${errorMessage}`;
          statusEl.className = 'mb-4 p-3 bg-red-900 border border-red-700 text-red-200 rounded';
          weekInfoEl.textContent = 'Unable to load week information';
          listEl.innerHTML = `
            <div class="bg-[#2D2D2D] border border-[#444444] p-4 rounded text-center">
              <p class="text-[#999999] mb-2">Failed to load from local database</p>
              <p class="text-sm text-[#777777]">Please ensure the database server is running and the mylar.db file is accessible.</p>
            </div>
          `;
        }
      }

      // Render pull list items grouped by publisher with collapsible sections
      function renderPullList(issues) {
        if (issues.length === 0) {
          listEl.innerHTML = '<div class="bg-[#2D2D2D] border border-[#444444] p-4 rounded text-center text-[#999999]">No issues in pull list</div>';
          return;
        }

        // Group issues by publisher
        const groupedByPublisher = {};
        issues.forEach(issue => {
          const publisher = issue.Publisher || 'Unknown Publisher';
          if (!groupedByPublisher[publisher]) {
            groupedByPublisher[publisher] = [];
          }
          groupedByPublisher[publisher].push(issue);
        });

        // Sort publishers alphabetically
        const sortedPublishers = Object.keys(groupedByPublisher).sort();

        // Render grouped content with collapsible sections
        const content = sortedPublishers.map((publisher, index) => {
          const publisherIssues = groupedByPublisher[publisher];
          const sectionId = `publisher-${index}`;
          const issuesHtml = publisherIssues.map(issue => `
            <div class="bg-[#2D2D2D] border border-[#444444] p-4 rounded shadow mb-2">
              <div class="flex justify-between items-start">
                <div class="flex-1">
                  <h2 class="font-semibold text-lg text-[#ECECEC]">${issue.ComicName || 'Unknown Series'}</h2>
                  <p class="text-sm text-[#CCCCCC]">Issue #${issue.Issue || 'Unknown'}</p>
                </div>
                <div class="ml-4">
                  <span class="inline-block px-2 py-1 text-xs rounded ${
                    issue.Status === 'Wanted' ? 'bg-[#CCAF45] text-[#1F1F1F]' : 
                    issue.Status === 'Downloaded' ? 'bg-green-700 text-green-200' :
                    issue.Status === 'Skipped' ? 'bg-gray-600 text-gray-200' :
                    'bg-[#444444] text-[#ECECEC]'
                  }">
                    ${issue.Status || 'Unknown'}
                  </span>
                </div>
              </div>
            </div>
          `).join('');

          return `
            <div class="mb-6">
              <button 
                class="w-full text-left focus:outline-none focus:ring-2 focus:ring-[#CCAF45] focus:ring-opacity-50 rounded"
                onclick="togglePublisherSection('${sectionId}')"
                aria-expanded="false"
                aria-controls="${sectionId}"
              >
                <h3 class="publisher-heading text-lg font-semibold text-[#CCAF45] mb-3 px-2 py-2 border-l-4 border-[#CCAF45] bg-[#2A2A2A] rounded-r hover:bg-[#333333] transition-colors duration-200 flex items-center justify-between">
                  <span>${publisher} (${publisherIssues.length})</span>
                  <svg id="icon-${sectionId}" class="w-5 h-5 transform transition-transform duration-200 rotate-[-90deg]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                  </svg>
                </h3>
              </button>
              <div id="${sectionId}" class="space-y-2 transition-all duration-300 ease-in-out overflow-hidden" style="display: none; max-height: 0px;">
                ${issuesHtml}
              </div>
            </div>
          `;
        }).join('');

        listEl.innerHTML = content;
        
        // Show the toggle all button once content is loaded
        const toggleAllButton = document.getElementById('toggleAllButton');
        if (toggleAllButton && sortedPublishers.length > 1) {
          toggleAllButton.style.display = 'block';
        }
      }

      // Initialize SQL.js availability check
      checkSqlJs().then(() => {
        console.log('Local SQL.js loaded successfully');
      }).catch(err => {
        console.warn('Local SQL.js failed to load:', err);
        console.log('Will show error message to user');
      });

      // Make functions and elements globally accessible
      window.statusEl = statusEl;
      window.listEl = listEl;
      window.weekInfoEl = weekInfoEl;
      window.loadPullList = loadPullList;
      window.loadPullListFromSQL = loadPullListFromSQL;
      window.checkSqlJs = checkSqlJs;
      window.renderPullList = renderPullList;
      window.updateNavigationButtons = updateNavigationButtons;

      // Initial load - wait for config to be ready
      async function initialLoad() {
        // Ensure config is initialized
        if (!mylarConfig) {
          console.log('Waiting for config initialization...');
          await new Promise(resolve => {
            const checkConfig = () => {
              if (mylarConfig) {
                resolve();
              } else {
                setTimeout(checkConfig, 50);
              }
            };
            checkConfig();
          });
        }
        console.log('Config ready, loading pull list...');
        loadPullList();
      }
      
      initialLoad();

      // Make navigateWeek available globally
      window.navigateWeek = function(direction) {
        const newOffset = currentWeekOffset + direction;
        
        // Limit navigation to -1 (Last Week), 0 (This Week), 1 (Next Week)
        if (newOffset < -1 || newOffset > 1) {
          return; // Don't navigate beyond these limits
        }
        
        currentWeekOffset = newOffset;
        console.log('Navigating to week offset:', currentWeekOffset);
        
        // Update header title based on offset
        const headerTitle = document.querySelector('header h1');
        if (currentWeekOffset === 0) {
          headerTitle.textContent = "This Week's Pull List";
        } else if (currentWeekOffset === -1) {
          headerTitle.textContent = "Last Week's Pull List";
        } else if (currentWeekOffset === 1) {
          headerTitle.textContent = "Next Week's Pull List";
        }
        
        // Update navigation button states
        updateNavigationButtons();
        
        // Reload the pull list with the new week offset
        loadPullListFromSQL();
      };
      
      // Update navigation button states based on current offset
      function updateNavigationButtons() {
        const prevBtn = document.getElementById('prevWeekBtn');
        const nextBtn = document.getElementById('nextWeekBtn');
        
        // Disable previous button if at last week (-1)
        if (currentWeekOffset <= -1) {
          prevBtn.disabled = true;
          prevBtn.classList.add('opacity-50', 'cursor-not-allowed');
          prevBtn.classList.remove('hover:bg-[#2D2D2D]');
        } else {
          prevBtn.disabled = false;
          prevBtn.classList.remove('opacity-50', 'cursor-not-allowed');
          prevBtn.classList.add('hover:bg-[#2D2D2D]');
        }
        
        // Disable next button if at next week (1)
        if (currentWeekOffset >= 1) {
          nextBtn.disabled = true;
          nextBtn.classList.add('opacity-50', 'cursor-not-allowed');
          nextBtn.classList.remove('hover:bg-[#2D2D2D]');
        } else {
          nextBtn.disabled = false;
          nextBtn.classList.remove('opacity-50', 'cursor-not-allowed');
          nextBtn.classList.add('hover:bg-[#2D2D2D]');
        }
      }
      
      // Initialize navigation button states
      updateNavigationButtons();
    });

    // Global toggle function for publisher sections
    function togglePublisherSection(sectionId) {
      const section = document.getElementById(sectionId);
      const icon = document.getElementById(`icon-${sectionId}`);
      const button = document.querySelector(`[aria-controls="${sectionId}"]`);
      
      if (section.style.display === 'none') {
        // Expand
        section.style.display = 'block';
        section.style.maxHeight = section.scrollHeight + 'px';
        icon.style.transform = 'rotate(0deg)';
        button.setAttribute('aria-expanded', 'true');
      } else {
        // Collapse
        section.style.maxHeight = '0px';
        icon.style.transform = 'rotate(-90deg)';
        button.setAttribute('aria-expanded', 'false');
        setTimeout(() => {
          if (section.style.maxHeight === '0px') {
            section.style.display = 'none';
          }
        }, 300);
      }
    }

    // Toggle all publisher sections
    function toggleAllPublisherSections() {
      const toggleAllButton = document.getElementById('toggleAllButton');
      const allSections = document.querySelectorAll('[id^="publisher-"]');
      const allExpanded = Array.from(allSections).every(section => section.style.display !== 'none');
      
      allSections.forEach((section, index) => {
        const sectionId = `publisher-${index}`;
        const icon = document.getElementById(`icon-${sectionId}`);
        const button = document.querySelector(`[aria-controls="${sectionId}"]`);
        
        if (allExpanded) {
          // Collapse all
          section.style.maxHeight = '0px';
          section.style.display = 'none';
          if (icon) icon.style.transform = 'rotate(-90deg)';
          if (button) button.setAttribute('aria-expanded', 'false');
        } else {
          // Expand all
          section.style.display = 'block';
          section.style.maxHeight = section.scrollHeight + 'px';
          if (icon) icon.style.transform = 'rotate(0deg)';
          if (button) button.setAttribute('aria-expanded', 'true');
        }
      });
      
      // Update button text
      toggleAllButton.textContent = allExpanded ? 'Expand All' : 'Collapse All';
    }

    // Theme switching support
    function applyThemeToElements() {
      const themeManager = window.themeManager;
      if (!themeManager) return;
      
      const theme = themeManager.currentTheme;
      console.log('Applying theme to pull list elements:', theme);
      
      // Apply theme to body
      const body = document.getElementById('main-body');
      if (body) {
        if (theme === 'light') {
          body.style.backgroundColor = '#FFFFFF';
          body.style.color = '#000000';
        } else {
          body.style.backgroundColor = '#1F1F1F';
          body.style.color = '#ECECEC';
        }
      }
      
      // Apply theme to header
      const header = document.querySelector('header');
      if (header) {
        if (theme === 'light') {
          header.style.backgroundColor = '#FFFFFF';
          header.style.borderColor = '#E5E7EB';
        } else {
          header.style.backgroundColor = '#1F1F1F';
          header.style.borderColor = '#444444';
        }
      }
      
      // Apply theme to navigation
      const nav = document.querySelector('nav');
      if (nav) {
        if (theme === 'light') {
          nav.style.backgroundColor = '#FFFFFF';
          nav.style.borderColor = '#E5E7EB';
        } else {
          nav.style.backgroundColor = '#1F1F1F';
          nav.style.borderColor = '#444444';
        }
      }
      
      // Apply theme to status element
      const statusEl = document.getElementById('status');
      if (statusEl) {
        if (theme === 'light') {
          statusEl.style.backgroundColor = '#F8F9FA';
          statusEl.style.borderColor = '#E5E7EB';
          statusEl.style.color = '#000000';
        } else {
          statusEl.style.backgroundColor = '#2D2D2D';
          statusEl.style.borderColor = '#444444';
          statusEl.style.color = '#ECECEC';
        }
      }
      
      // Apply theme to buttons
      document.querySelectorAll('#prevWeekBtn, #nextWeekBtn').forEach(btn => {
        if (theme === 'light') {
          btn.style.color = '#B8860B';
        } else {
          btn.style.color = '#CCAF45';
        }
      });
      
      // Apply theme to week info
      const weekInfo = document.getElementById('weekInfo');
      if (weekInfo) {
        if (theme === 'light') {
          weekInfo.style.color = '#B8860B';
        } else {
          weekInfo.style.color = '#CCAF45';
        }
      }
      
      // Apply theme to toggle all button
      const toggleAllButton = document.getElementById('toggleAllButton');
      if (toggleAllButton) {
        if (theme === 'light') {
          toggleAllButton.style.backgroundColor = '#F8F9FA';
          toggleAllButton.style.borderColor = '#E5E7EB';
          toggleAllButton.style.color = '#B8860B';
        } else {
          toggleAllButton.style.backgroundColor = '#2D2D2D';
          toggleAllButton.style.borderColor = '#444444';
          toggleAllButton.style.color = '#CCAF45';
        }
      }
      
      // Apply theme to all publisher headings
      document.querySelectorAll('.publisher-heading').forEach(heading => {
        if (theme === 'light') {
          heading.style.color = '#B8860B';
          heading.style.backgroundColor = '#F8F9FA';
          heading.style.borderColor = '#B8860B';
        } else {
          heading.style.color = '#CCAF45';
          heading.style.backgroundColor = '#2A2A2A';
          heading.style.borderColor = '#CCAF45';
        }
      });
      
      // Apply theme to cards
      document.querySelectorAll('.bg-\\[#2D2D2D\\]').forEach(card => {
        if (theme === 'light') {
          card.style.backgroundColor = '#F8F9FA';
          card.style.borderColor = '#E5E7EB';
        } else {
          card.style.backgroundColor = '#2D2D2D';
          card.style.borderColor = '#444444';
        }
      });
      
      // Apply theme to text elements
      document.querySelectorAll('.text-\\[#ECECEC\\]').forEach(text => {
        if (theme === 'light') {
          text.style.color = '#000000';
        } else {
          text.style.color = '#ECECEC';
        }
      });
      
      document.querySelectorAll('.text-\\[#CCCCCC\\]').forEach(text => {
        if (theme === 'light') {
          text.style.color = '#6B7280';
        } else {
          text.style.color = '#CCCCCC';
        }
      });
      
      document.querySelectorAll('.text-\\[#999999\\]').forEach(text => {
        if (theme === 'light') {
          text.style.color = '#9CA3AF';
        } else {
          text.style.color = '#999999';
        }
      });
    }

    // Listen for theme changes
    document.addEventListener('themeChanged', applyThemeToElements);
    
    // Apply theme on page load
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        applyThemeToElements();
      }, 100);
      initializeAutoRefreshForPullList();
    });

    // Initialize auto-refresh for pull list page
    function initializeAutoRefreshForPullList() {
      // Check if auto-refresh is enabled
      const autoRefreshEnabled = localStorage.getItem('autoRefreshEnabled') !== 'false';
      
      if (autoRefreshEnabled) {
        console.log('Auto-refresh is enabled for pull list page');
        
        // Set up auto-refresh interval (15 minutes)
        setInterval(async () => {
          console.log('Auto-refreshing pull list data...');
          await refreshPullListData();
        }, 15 * 60 * 1000);
      }
    }

    // Function to refresh pull list data
    async function refreshPullListData() {
      try {
        // Re-run the pull list loading function if it exists
        if (typeof loadPullList === 'function') {
          await loadPullList();
        } else if (typeof fetchPullList === 'function') {
          await fetchPullList();
        } else {
          // Fallback: reload the page
          window.location.reload();
        }
        
        console.log('Pull list data refreshed successfully');
        
        // Show subtle refresh notification
        showPullListRefreshNotification('Pull list refreshed automatically');
        
      } catch (error) {
        console.error('Failed to refresh pull list data:', error);
      }
    }

    // Expose refresh function globally for settings page
    window.refreshPullList = refreshPullListData;

    function showPullListRefreshNotification(message) {
      const toast = document.createElement('div');
      toast.className = 'fixed top-20 left-4 right-4 bg-green-600 text-white p-3 rounded-lg shadow-lg z-50 transform transition-transform duration-300 text-sm';
      toast.innerHTML = `
        <div class="flex items-center space-x-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          <span>${message}</span>
        </div>
      `;
      toast.style.transform = 'translateY(-100px)';
      
      document.body.appendChild(toast);
      
      setTimeout(() => {
        toast.style.transform = 'translateY(0)';
      }, 100);
      
      setTimeout(() => {
        toast.style.transform = 'translateY(-100px)';
        setTimeout(() => {
          if (document.body.contains(toast)) {
            document.body.removeChild(toast);
          }
        }, 300);
      }, 2000);
    }
    
    // Also apply theme when content is rendered
    const originalRenderPullList = renderPullList;
    renderPullList = function(issues) {
      originalRenderPullList(issues);
      setTimeout(() => {
        applyThemeToElements();
      }, 50);
    };
  </script>
</body>
</html>
