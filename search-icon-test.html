<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Icon Test</title>
  <link rel="stylesheet" href="themes.css">
  <script src="theme-manager.js"></script>
  <style>
    body {
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    .test-container {
      max-width: 400px;
      margin: 0 auto;
    }
    
    .theme-toggle {
      margin-bottom: 20px;
      text-align: center;
    }
    
    .theme-toggle button {
      margin: 0 10px;
      padding: 10px 20px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-secondary);
      color: var(--text-primary);
      border-radius: 5px;
      cursor: pointer;
    }
    
    .theme-toggle button:hover {
      background-color: var(--accent-primary);
      color: var(--bg-primary);
    }
    
    .search-test {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      background-color: var(--bg-secondary);
      margin-bottom: 20px;
    }
    
    .search-test h3 {
      margin-top: 0;
      color: var(--text-primary);
    }
  </style>
</head>
<body>
  <div class="test-container">
    <div class="theme-toggle">
      <button onclick="switchTheme('dark')">Dark Theme</button>
      <button onclick="switchTheme('light')">Light Theme</button>
    </div>
    
    <div class="search-test">
      <h3>Search Icon Test</h3>
      <div class="search-container" style="background-color: var(--bg-primary); border: 1px solid var(--border-color); padding: 12px; border-radius: 8px;">
        <div class="flex space-x-3" style="display: flex; gap: 12px;">
          <div class="relative flex-1" style="position: relative; flex: 1;">
            <input id="searchInput" type="text" placeholder="Search for comics to add..." 
                   class="w-full pl-10 pr-4 py-3 search-input" style="width: 100%; padding: 12px 16px 12px 2.5rem; border-radius: 6px;" />
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 absolute left-3 top-1/2 transform -translate-y-1/2" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="color: var(--text-tertiary); position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px;">
              <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <button id="searchButton" class="px-6 py-3 rounded-md transition-colors duration-200 font-medium whitespace-nowrap search-button" style="padding: 12px 24px; border-radius: 6px; white-space: nowrap;">
            Search
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Initialize theme manager
    const themeManager = new ThemeManager();
    
    function switchTheme(theme) {
      themeManager.applyTheme(theme);
      
      // Dispatch theme change event
      window.dispatchEvent(new CustomEvent('themeChanged', { detail: { theme } }));
      
      // Apply search styles manually for testing
      setTimeout(() => {
        applySearchInputStyles();
      }, 100);
    }
    
    function applySearchInputStyles() {
      // Update search container background
      const searchContainer = document.querySelector('.search-container');
      if (searchContainer) {
        const bgPrimary = getComputedStyle(document.documentElement).getPropertyValue('--bg-primary').trim();
        const borderColor = getComputedStyle(document.documentElement).getPropertyValue('--border-color').trim();
        searchContainer.style.backgroundColor = bgPrimary;
        searchContainer.style.borderColor = borderColor;
      }
      
      // Update search input styles
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        const bgSecondary = getComputedStyle(document.documentElement).getPropertyValue('--bg-secondary').trim();
        const textPrimary = getComputedStyle(document.documentElement).getPropertyValue('--text-primary').trim();
        const borderColor = getComputedStyle(document.documentElement).getPropertyValue('--border-color').trim();
        
        searchInput.style.backgroundColor = bgSecondary;
        searchInput.style.color = textPrimary;
        searchInput.style.borderColor = borderColor;
      }
      
      // Update search icon color and ensure no background issues
      const searchIcon = document.querySelector('.search-container .relative svg');
      if (searchIcon) {
        const textTertiary = getComputedStyle(document.documentElement).getPropertyValue('--text-tertiary').trim();
        searchIcon.style.color = textTertiary;
        searchIcon.style.background = 'none';
        searchIcon.style.backgroundColor = 'transparent';
      }
      
      // Update search button
      const searchButton = document.getElementById('searchButton');
      if (searchButton) {
        const accentPrimary = getComputedStyle(document.documentElement).getPropertyValue('--accent-primary').trim();
        const bgPrimary = getComputedStyle(document.documentElement).getPropertyValue('--bg-primary').trim();
        
        searchButton.style.backgroundColor = accentPrimary;
        searchButton.style.color = bgPrimary;
      }
    }
    
    // Apply styles on page load
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(applySearchInputStyles, 200);
    });
    
    // Listen for theme changes
    window.addEventListener('themeChanged', () => {
      setTimeout(applySearchInputStyles, 100);
    });
  </script>
</body>
</html>
